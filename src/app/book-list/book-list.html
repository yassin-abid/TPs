<div>
  <h2>Liste des livres</h2>
  
  <div class="search-sort-container">
    <label for="search">Rechercher : </label>
    <input 
      type="text" 
      id="search" 
      [(ngModel)]="searchTerm" 
      placeholder="Titre, auteur ou catégorie...">
    
    <label for="sort">Trier par : </label>
    <select id="sort" [(ngModel)]="sortBy">
      <option value="">Aucun tri</option>
      <option value="category">Catégorie</option>
      <option value="available">Disponibilité</option>
    </select>

    <strong>Total : {{ totalBooks }} livre(s)</strong>
  </div>

  <table>
    <thead>
      <tr>
        <th>Titre</th>
        <th>Auteur</th>
        <th>Catégorie</th>
        <th>Disponible</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (book of filteredBooks; track book.id) {
        <tr>
          <td>{{ book.title }}</td>
          <td>{{ book.author }}</td>
          <td>{{ book.category }}</td>
          <td>{{ book.isAvailable ? 'Oui' : 'Non' }}</td>
          <td>
            <button (click)="editBook.emit(book)">Modifier</button>
            <button (click)="deleteBook.emit(book.id)">Supprimer</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" style="text-align: center;">Aucun livre disponible</td>
        </tr>
      }
    </tbody>
  </table>
</div>
