<div class="question-container">
  <h3 class="question-text">{{ question.question }}</h3>
  
  <div class="options-grid">
    <button
      *ngFor="let option of question.options"
      [class]="getButtonClass(option)"
      (click)="onSelectOption(option)"
      [disabled]="isAnswered"
    >
      {{ option }}
    </button>
  </div>

</div>
